<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manage Participants - Trip Expense Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Centralized Cloud Configuration & Sync Script -->
    <script src="config.js"></script>
  <meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-[#F8F9FA] text-[#212529] font-sans antialiased pb-28 min-h-screen relative">

    <!-- Header -->
    <header class="bg-[#212529] text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-sm text-gray-300 hover:text-white">&larr; Back to Dashboard</a>
            <h1 class="text-base font-bold">Manage Participants</h1>
            <div class="w-12"></div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Add Participant Form Section -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
            <h2 id="formTitle" class="text-sm font-bold text-black border-b border-gray-100 pb-2">Add New Participant</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Participant Name</label>
                    <input type="text" id="inputName" placeholder="e.g. Ankur Jain" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold focus:outline-none focus:border-black">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Category</label>
                        <select id="selectCategory" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold focus:outline-none focus:border-black">
                            <option value="Adult">Adult</option>
                            <option value="Child">Child</option>
                            <option value="Senior">Senior</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Family Group</label>
                        <select id="selectFamily" onchange="handleFamilyDropdownChange(this)" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold focus:outline-none focus:border-black">
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                </div>

                <div class="flex space-x-2 pt-1">
                    <button id="btnCancelEdit" onclick="resetForm()" class="hidden w-1/3 bg-gray-100 text-gray-700 font-bold py-2.5 rounded-xl text-xs">Cancel</button>
                    <button id="btnSaveParticipant" onclick="saveParticipant()" class="flex-1 bg-[#0D6EFD] text-white font-bold py-2.5 rounded-xl text-xs shadow-sm">Add Participant</button>
                </div>
            </div>
        </section>

        <!-- Roster List Section -->
        <section class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-bold text-black">Roster List</h2>
                <button onclick="mapCheckedToTrip()" class="bg-[#198754] text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-sm">Map Checked to Trip</button>
            </div>

            <div id="rvParticipants" class="space-y-2">
                <p class="text-xs text-gray-400 text-center py-4">No participants added yet.</p>
            </div>
        </section>

    </main>

    <!-- Script Logic -->
    <script>
        let editingParticipantId = null;
        const selectedMemberIds = {};

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof syncFromCloud === 'function') {
                await syncFromCloud();
            }
            loadFamilyDropdown();
            loadParticipantsList();
        });

        function getFamilies() {
            try {
                const raw = localStorage.getItem('families');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        return parsed.map((item, idx) => {
                            if (typeof item === 'string') {
                                return { id: Date.now() + idx, familyName: item.trim() };
                            }
                            return item;
                        });
                    }
                }
            } catch (e) {}
            return [];
        }

        function loadFamilyDropdown(selectFamilyId = null) {
            const select = document.getElementById('selectFamily');
            select.innerHTML = '';

            const families = getFamilies();
            
            const unassignedOpt = document.createElement('option');
            unassignedOpt.value = "";
            unassignedOpt.textContent = "Unassigned / Individual";
            select.appendChild(unassignedOpt);

            families.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.id;
                opt.textContent = f.familyName;
                if (selectFamilyId && f.id == selectFamilyId) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });

            const createNewOpt = document.createElement('option');
            createNewOpt.value = "CREATE_NEW";
            createNewOpt.textContent = "+ Create New Family...";
            createNewOpt.className = "font-bold text-blue-600";
            select.appendChild(createNewOpt);
        }

        function handleFamilyDropdownChange(selectElement) {
            if (selectElement.value === "CREATE_NEW") {
                const newFamilyName = prompt('Enter new family group name (e.g. Sharma Family):');
                if (newFamilyName && newFamilyName.trim()) {
                    const name = newFamilyName.trim();
                    let families = getFamilies();

                    if (!families.some(f => f.familyName.toLowerCase() === name.toLowerCase())) {
                        const newFamily = { id: Date.now(), familyName: name };
                        families.push(newFamily);
                        localStorage.setItem('families', JSON.stringify(families));

                        if (typeof syncToCloud === 'function') {
                            syncToCloud();
                        }

                        loadFamilyDropdown(newFamily.id);
                        alert(`Family "${name}" created and selected!`);
                    } else {
                        alert('A family with this name already exists.');
                        selectElement.value = ""; 
                    }
                } else {
                    selectElement.value = ""; 
                }
            }
        }

        function getParticipants() {
            try {
                return JSON.parse(localStorage.getItem('participants') || '[]');
            } catch (e) {
                return [];
            }
        }

        function saveParticipant() {
            const nameInput = document.getElementById('inputName');
            const categorySelect = document.getElementById('selectCategory');
            const familySelect = document.getElementById('selectFamily');

            const name = nameInput.value.trim();
            const category = categorySelect.value;
            const familyId = familySelect.value;
            
            const families = getFamilies();
            const selectedFamilyObj = families.find(f => f.id == familyId);
            const familyName = selectedFamilyObj ? selectedFamilyObj.familyName : 'Unassigned';

            if (!name) {
                alert('Please enter a participant name.');
                return;
            }

            let participants = getParticipants();

            if (editingParticipantId) {
                participants = participants.map(p => p.id === editingParticipantId ? {
                    ...p,
                    name,
                    category,
                    familyId: familyId ? Number(familyId) : null,
                    family: familyName
                } : p);
                editingParticipantId = null;
                document.getElementById('formTitle').textContent = 'Add New Participant';
                document.getElementById('btnSaveParticipant').textContent = 'Add Participant';
                document.getElementById('btnCancelEdit').classList.add('hidden');
            } else {
                const newParticipant = {
                    id: Date.now(),
                    name,
                    category,
                    familyId: familyId ? Number(familyId) : null,
                    family: familyName
                };
                participants.push(newParticipant);
            }

            localStorage.setItem('participants', JSON.stringify(participants));
            
            if (typeof syncToCloud === 'function') {
                syncToCloud();
            }

            nameInput.value = '';
            loadFamilyDropdown(); 
            loadParticipantsList();
            alert('Participant saved successfully!');
        }

        function loadParticipantsList() {
            const participants = getParticipants();
            const container = document.getElementById('rvParticipants');
            container.innerHTML = '';

            if (participants.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-400 bg-white p-4 rounded-xl border border-gray-100 text-center">No participants added yet.</p>';
                return;
            }

            participants.forEach(p => {
                const isChecked = selectedMemberIds[p.id] ? 'checked' : '';
                const card = document.createElement('div');
                card.className = 'bg-white p-3 rounded-xl border border-gray-100 flex justify-between items-center text-xs';
                card.innerHTML = `
                    <label class="flex items-center space-x-2.5 cursor-pointer flex-1">
                        <input type="checkbox" ${isChecked} onchange="selectedMemberIds[${p.id}] = this.checked;" class="w-4 h-4 text-blue-600 rounded">
                        <div>
                            <p class="font-bold text-black text-sm">${p.name} <span class="text-[10px] text-gray-500 font-normal">(${p.category})</span></p>
                            <p class="text-gray-400 text-[11px]">Family: ${p.family || 'Unassigned'}</p>
                        </div>
                    </label>
                    <div class="flex space-x-1">
                        <button onclick="editParticipant(${p.id})" class="bg-gray-100 text-gray-700 font-bold px-2.5 py-1 rounded-lg text-[11px]">Edit</button>
                        <button onclick="deleteParticipant(${p.id})" class="bg-[#DC3545] text-white font-bold px-2.5 py-1 rounded-lg text-[11px]">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function editParticipant(id) {
            const participants = getParticipants();
            const p = participants.find(item => item.id === id);
            if (!p) return;

            document.getElementById('inputName').value = p.name;
            document.getElementById('selectCategory').value = p.category || 'Adult';
            if (p.familyId) {
                document.getElementById('selectFamily').value = p.familyId;
            } else {
                document.getElementById('selectFamily').value = "";
            }

            editingParticipantId = id;
            document.getElementById('formTitle').textContent = 'Edit Participant';
            document.getElementById('btnSaveParticipant').textContent = 'Update Participant';
            document.getElementById('btnCancelEdit').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            editingParticipantId = null;
            document.getElementById('inputName').value = '';
            document.getElementById('selectFamily').value = "";
            document.getElementById('formTitle').textContent = 'Add New Participant';
            document.getElementById('btnSaveParticipant').textContent = 'Add Participant';
            document.getElementById('btnCancelEdit').classList.add('hidden');
        }

        function deleteParticipant(id) {
            if (confirm('Are you sure you want to delete this participant?')) {
                let participants = getParticipants().filter(p => p.id !== id);
                localStorage.setItem('participants', JSON.stringify(participants));
                delete selectedMemberIds[id];

                if (typeof syncToCloud === 'function') {
                    syncToCloud();
                }
                loadParticipantsList();
            }
        }

        function mapCheckedToTrip() {
            const checkedIds = Object.keys(selectedMemberIds)
                .filter(id => selectedMemberIds[id] === true)
                .map(id => Number(id));

            if (checkedIds.length === 0) {
                alert('Please check at least one participant.');
                return;
            }

            const trips = JSON.parse(localStorage.getItem('trips') || '[]');
            if (trips.length === 0) {
                alert('No open trips found. Please create a trip first.');
                return;
            }

            const tripNames = trips.map((t, idx) => `${idx + 1}. ${t.destination} (${t.nature})`).join('\n');
            const selection = prompt(`Select Trip Number to Map Participants:\n${tripNames}`, '1');
            const index = parseInt(selection) - 1;

            if (!isNaN(index) && trips[index]) {
                const targetTripId = trips[index].id;
                let tripMappings = JSON.parse(localStorage.getItem('tripParticipants') || '{}');
                let existingAssigned = tripMappings[targetTripId] || [];
                
                const combinedIds = Array.from(new Set([...existingAssigned, ...checkedIds]));
                tripMappings[targetTripId] = combinedIds;
                
                localStorage.setItem('tripParticipants', JSON.stringify(tripMappings));
                localStorage.setItem('activeTripId', targetTripId);

                if (typeof syncToCloud === 'function') {
                    syncToCloud();
                }

                alert(`Successfully mapped ${checkedIds.length} participant(s) to ${trips[index].destination}!`);
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
