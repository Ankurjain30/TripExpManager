<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manage Categories - Trip Expense Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Centralized Cloud Configuration & Sync Script -->
    <script src="config.js"></script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-[#F8F9FA] text-[#212529] font-sans antialiased pb-24 min-h-screen relative">

    <!-- Header -->
    <header class="bg-[#212529] text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-sm text-gray-300 hover:text-white">&larr; Back to Dashboard</a>
            <h1 class="text-base font-bold">Categories Master</h1>
            <div class="w-12"></div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Header Title matching Android layout -->
        <h2 id="tvManageCategoryHeader" class="text-base font-bold text-[#212529] px-1 pb-1">
            Global Expense Categories Master
        </h2>

        <!-- Categories List Container -->
        <div id="rvCategories" class="space-y-2.5 pb-20">
            <p class="text-xs text-gray-500 bg-white p-4 rounded-xl border border-gray-100 text-center">No categories available. Tap (+) to create one.</p>
        </div>

    </main>

    <!-- Floating Action Button (+ Add Category) matching Android FAB -->
    <button id="fabAddCategory" class="fixed bottom-6 right-6 w-14 h-14 bg-[#0D6EFD] text-white rounded-full shadow-lg flex items-center justify-center text-2xl font-bold active:scale-95 transition z-50">
        +
    </button>

    <!-- Categories Logic Script -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof syncFromCloud === 'function') {
                await syncFromCloud();
            }
            loadCategories();

            // Floating Action Button click handler
            document.getElementById('fabAddCategory').addEventListener('click', () => {
                const newCat = prompt('Enter new expense category name:');
                if (newCat && newCat.trim()) {
                    const catName = newCat.trim();
                    let categories = JSON.parse(localStorage.getItem('categories') || '[]');
                    if (!categories.includes(catName)) {
                        categories.push(catName);
                        localStorage.setItem('categories', JSON.stringify(categories));
                        
                        // Sync changes to GitHub Gist cloud backend via config.js
                        if (typeof syncToCloud === 'function') {
                            syncToCloud();
                        }

                        loadCategories();
                    } else {
                        alert('Category already exists.');
                    }
                }
            });
        });

        function loadCategories() {
            let categories = JSON.parse(localStorage.getItem('categories') || '[]');
            localStorage.setItem('categories', JSON.stringify(categories));

            const container = document.getElementById('rvCategories');
            container.innerHTML = '';

            if (categories.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-500 bg-white p-4 rounded-xl border border-gray-100 text-center">No categories available. Tap (+) to create one.</p>';
                return;
            }

            categories.forEach((cat) => {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-2xl border border-gray-100 flex justify-between items-center shadow-sm';
                card.innerHTML = `
                    <span class="text-sm font-bold text-black">${cat}</span>
                    <div class="flex items-center space-x-2">
                        <button onclick="editCategory('${cat}')" class="text-xs text-blue-600 font-bold px-3 py-1 bg-blue-50 rounded-lg hover:bg-blue-100 transition">Edit</button>
                        <button onclick="deleteCategory('${cat}')" class="text-xs text-red-500 font-bold px-3 py-1 bg-red-50 rounded-lg hover:bg-red-100 transition">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function editCategory(oldName) {
            const newName = prompt(`Rename category "${oldName}" to:`, oldName);
            if (newName && newName.trim() && newName.trim() !== oldName) {
                const updatedName = newName.trim();
                let categories = JSON.parse(localStorage.getItem('categories') || '[]');
                
                if (categories.includes(updatedName)) {
                    alert('A category with this name already exists.');
                    return;
                }

                categories = categories.map(c => c === oldName ? updatedName : c);
                localStorage.setItem('categories', JSON.stringify(categories));

                // Update any saved expenses using this category
                let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
                expenses = expenses.map(e => e.category === oldName ? { ...e, category: updatedName } : e);
                localStorage.setItem('expenses', JSON.stringify(expenses));

                // Sync changes to GitHub Gist cloud backend via config.js
                if (typeof syncToCloud === 'function') {
                    syncToCloud();
                }

                loadCategories();
                alert('Category updated successfully!');
            }
        }

        function deleteCategory(catName) {
            let categories = JSON.parse(localStorage.getItem('categories') || '[]');
            if (confirm(`Delete category "${catName}"?`)) {
                categories = categories.filter(c => c !== catName);
                localStorage.setItem('categories', JSON.stringify(categories));
                
                // Sync changes to GitHub Gist cloud backend via config.js
                if (typeof syncToCloud === 'function') {
                    syncToCloud();
                }

                loadCategories();
            }
        }
    </script>
</body>
</html>
